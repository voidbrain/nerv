name: Backlog views

# F-096-T03 (owner decision 2026-11-25, option A): with workItems.views "built", publish the built backlog views of each
# push to main on the backlog-views branch. Never on a pull request: no PR code runs with write access. The only job with
# contents: write is `publish`; it fast-forwards refs/heads/backlog-views and nothing else, never with --force. Copy this
# workflow only when the project sets workItems.views to "built"; PRs get the views as a CI artifact instead.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backlog-views
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the reconcile log's same-day entries are ordered by ancestry

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Publish the built views on backlog-views
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node tools/work-items.mjs publish
